# 云端打包：把游戏同时打成 Windows / macOS / Linux 三个版本。
#   * 手动触发：GitHub 仓库页面 → Actions → "打包游戏" → Run workflow
#   * 自动发布：推送一个以 v 开头的标签（例如 git tag v0.1.0 && git push origin v0.1.0），
#               打包完成后会自动创建 Release 并附上三个 zip，玩家直接去 Releases 页面下载。
# 注意：这个文件必须放在仓库根目录的 .github/workflows/ 下。如果你的游戏代码在仓库的子文件夹里，
#       把下面各步骤的 working-directory 改成那个子文件夹。
name: 打包游戏

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      RW_NO_DIALOG: "1"          # CI 里崩溃测试不要弹窗
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: python -m pip install -r requirements-build.txt

      - name: 打包前自检 + 测试
        run: |
          python -m tools.package_check
          python -m tools.package_test

      - name: 打包
        run: python build.py

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: game-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
